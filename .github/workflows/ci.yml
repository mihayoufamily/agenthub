name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 = Electron 37 自带的 Node 版本；原先钉 20 会让一条弃用警告断言在 CI 上变成空转
          # （DEP0190 是 Node ≥22 才有的），本地/应用内/CI 三处的运行时版本越接近越好
          node-version: 22
          cache: npm
      # CI 仅类型检查与构建（tsc + rollup，均无原生依赖），跳过 electron 二进制下载
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # 注入面（no-danger / eval / new Function / 隐式 eval）由 ESLint 机器拦；0 error 为过，warn 不拦
      - run: npm run lint
      - run: npm run build
      # 逻辑层回归：不起应用、不花额度。此前 CI 只做构建，断言从未在机器上跑过。
      # 断言条数不在这里写死（会随套件增长漂移）：verify/run-all.mjs 的 SUITES 表带每套件
      # min（某一轮实测的 PASS 数），条数一掉就跑红，CI 只要 `npm run verify` 退出码为 0。
      #
      # 输出同时落盘并上传为 artifact：GitHub 的 job 日志会把长输出截断（实测一次失败只留下
      # 十几行 PASS），"红了但看不出是哪条"会让下一次排查只能靠猜。`shell: bash` 的默认参数
      # 带 `-eo pipefail`，所以 tee 之后退出码仍是 npm 的。
      - run: npm run verify 2>&1 | tee verify.log
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          # 汇总日志 + 每个套件的原始输出（run-all 回显会截断，文件不会）
          path: |
            verify.log
            verify-logs/
          if-no-files-found: warn
      # 运行时依赖只有 react/react-dom/zustand；出高危就拦，dev 依赖噪音不拦
      - run: npm audit --omit=dev --audit-level=high
