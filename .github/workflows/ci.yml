name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # CI 仅类型检查与构建（tsc + rollup，均无原生依赖），跳过 electron 二进制下载
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      # 逻辑层回归：不起应用、不花额度。此前 CI 只做构建，427 条断言从未在机器上跑过
      - run: npm run verify
      # 运行时依赖只有 react/react-dom/zustand；出高危就拦，dev 依赖噪音不拦
      - run: npm audit --omit=dev --audit-level=high
