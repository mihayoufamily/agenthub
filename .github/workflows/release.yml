name: Release

# 两个触发方式，两条互不相干的产物链路：
#   push v* tag  -> portable：构建 -> 组装便携版（明文 resources/app，不打 asar）-> zip -> 建 GitHub Release
#   workflow_dispatch -> installer：electron-builder 出 NSIS 安装包（asar: true），只传 workflow artifact、不碰 Release
# 为什么要有第二条：`asar` 与 `NSIS` 这两件事在开发机上从没跑通过（本机 app-builder 受限），
# 而便携版走的是明文目录，压根不经过 asar。这条链路把"安装包形态"变成 runner 上可重复验证的东西。
# 前置：portable 要求 package.json 的 version 与 tag 一致（下方校验步骤强约束）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 顶层给最小权限；需要写 Release 的 portable job 自己在 job 级抬回 contents: write
permissions:
  contents: read

jobs:
  portable:
    # tag 触发专属：这条里的 zip 名、校验都拿 github.ref_name 当版本号，
    # workflow_dispatch 时 ref_name 是分支名（main），会把版本校验步骤带歪
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "tag ${{ github.ref_name }} 与 package.json version $pkg 不一致；请先同步版本号"
            exit 1
          }

      - run: npm ci
      - run: npm run build

      # 公网接入（手机端 quick tunnel）捆绑：bin/ 不进 git（15MB 二进制），CI 打包前现下
      - name: 下载 cloudflared（捆绑到 resources/bin）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile bin/cloudflared.exe
          $n = (Get-Item bin/cloudflared.exe).Length
          Write-Host "cloudflared.exe：$([math]::Round($n / 1MB, 1)) MB"
          if ($n -lt 5MB) { Write-Error "cloudflared.exe 只有 $n 字节，下载不完整"; exit 1 }

      - run: npm run pack:portable

      - name: 打 zip（平铺，解压即见 AgentHub.exe）
        shell: pwsh
        run: |
          $zip = "AgentHub-${{ github.ref_name }}-win-x64-portable.zip"
          $dir = "release/AgentHub-win-x64"
          $tar = "$env:SystemRoot\System32\tar.exe"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # 先验"打包目录本身像不像真产物"，再谈压缩。实测踩过两种空壳：
          # pack:portable 找不到 electron 二进制时是**报错退出**（这一步会红），
          # 而 electron-builder 那条路会建出**空目录**——所以必须按文件逐个查，不能只看目录存在。
          # 清单里刻意不放那个中文名说明文件：本机 PowerShell 5.1 会把无 BOM 的脚本按 ANSI 读，
          # 名字一进字面量就成乱码（实测会把好包判成"缺文件"），守"pack 真跑过"用上面这几个就够了。
          foreach ($must in @('AgentHub.exe', 'resources/app/package.json', 'resources/app/out/main/index.js', 'resources/app/dist/renderer/bundle.js', 'resources/app/build/icon.ico', 'start-compat-mode.cmd')) {
            if (-not (Test-Path (Join-Path $dir $must))) { Write-Error "便携目录缺 $must"; exit 1 }
          }
          $src = Get-ChildItem -Path $dir -Recurse -File -Force | Measure-Object -Property Length -Sum
          Write-Host "源目录：$($src.Count) 个文件，$([math]::Round($src.Sum / 1MB, 1)) MB"
          # 实测（319MB 真产物）：Compress-Archive -Path release/AgentHub-win-x64 把 118 个条目全套进
          # AgentHub-win-x64/ 一层，解压后根目录没有 AgentHub.exe，与历史包/使用说明不一致；用系统自带 bsdtar
          & $tar -a -c -f $zip -C $dir .
          # pwsh 不会因为原生命令非零退出而停，必须自己接 $LASTEXITCODE——
          # 上一轮就是死在这：tar 写包时报错、zip 文件照样存在，Test-Path 过关，问题被推到下一步的 `tar -tf`，
          # 报出来的却是"读"的错误（ZIP decompression failed），看着像自检的锅。
          # 加了退出码检查后真因露出来：runner 上 bsdtar **写包时崩溃**（exit=-1073741819 = 0xC0000005），
          # 而本机同一个 tar.exe 压同一份 318.5MB/126 文件的目录 10.2s 出包、exit 0——是 runner 环境的事，不是命令的事。
          if ($LASTEXITCODE -ne 0) {
            Write-Host "bsdtar 写包失败（exit=$LASTEXITCODE），改用 .NET 的 ZipFile。"
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            # 实测对比三种压缩（本机对同一份 126 文件 / 318.5MB 真产物）：
            #   bsdtar `-a -c -f`：134,169,473 字节，exit 0（但 runner 上会崩 0xC0000005）
            #   Compress-Archive -Path 目录/*：134,230,801 字节，能用，但**里面有一个空名条目**，
            #     tar 读它会报 `Archive entry has empty or unreadable filename ... skipping` 并非零退出
            #   ZipFile.CreateFromDirectory：134,230,575 字节，条目直接是 `AgentHub.exe` 打头
            #     （不带 ./、没有空名条目），tar -tf 与 tar -xf 都 exit 0、解出来根级就是 AgentHub.exe、126 个文件
            # CreateFromDirectory 压的是**目录内容**，所以平铺结构天然成立，不需要 glob。
            # 它是 cmdlet/API，不设 $LASTEXITCODE，成败只能用 try/catch + Test-Path 判。
            try {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              [System.IO.Compression.ZipFile]::CreateFromDirectory(
                [System.IO.Path]::GetFullPath($dir), [System.IO.Path]::GetFullPath($zip))
            } catch {
              Write-Error "两种压缩都失败：bsdtar exit≠0，ZipFile 报 $($_.Exception.Message)"
              exit 1
            }
            if (-not (Test-Path $zip)) { Write-Error "ZipFile 没产出 zip"; exit 1 }
          }
          if (-not (Test-Path $zip)) { Write-Error "zip 未生成"; exit 1 }
          $zipBytes = (Get-Item $zip).Length
          Write-Host "zip：$([math]::Round($zipBytes / 1MB, 1)) MB"
          if ($zipBytes -lt 50MB) { Write-Error "zip 只有 $([math]::Round($zipBytes / 1MB, 1)) MB，不像是完整便携包"; exit 1 }
          # 自检改成"真解一遍"而不是 `tar -tf`：用户拿到包做的事是解压，
          # 只有解出来能看见根级 AgentHub.exe、文件数对得上，这个包才算数。
          $tmp = Join-Path $(if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }) "zipcheck"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          # 解包也用两套：runner 上 bsdtar 连写都会崩，读同样不能当成必然成立
          & $tar -xf $zip -C $tmp
          if ($LASTEXITCODE -ne 0) {
            Write-Host "bsdtar 解包失败（exit=$LASTEXITCODE），改用 Expand-Archive 自检"
            try {
              Expand-Archive -Path $zip -DestinationPath $tmp -Force -ErrorAction Stop
            } catch {
              Write-Error "zip 两种工具都解不开：$($_.Exception.Message)"
              exit 1
            }
          }
          if (-not (Test-Path (Join-Path $tmp 'AgentHub.exe'))) { Write-Error "解压后根目录没有 AgentHub.exe（平铺结构被改坏了）"; exit 1 }
          $out = Get-ChildItem -Path $tmp -Recurse -File -Force | Measure-Object -Property Length -Sum
          if ($out.Count -ne $src.Count) { Write-Error "包内文件数与源目录不符：$($out.Count) vs $($src.Count)"; exit 1 }
          Write-Host "解包自检：$($out.Count) 个文件，$([math]::Round($out.Sum / 1MB, 1)) MB"
          # 顺手把 sha256 打进日志，与 GitHub 侧资产的 digest 对得上才叫"发出去的就是这个包"
          Write-Host "sha256：$((Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower())"
          # 必须显式退 0：Actions 的 pwsh 包装会把**残留的 $LASTEXITCODE** 当步骤退出码。
          # 上一轮三条判据全过（126 文件 / 318.5MB / 根级 AgentHub.exe），却因为 `tar -xf` 留下的 1 被判失败——
          # 判据都绿了还红，这种红没人看得懂。
          exit 0

      - uses: softprops/action-gh-release@v2
        with:
          files: AgentHub-${{ github.ref_name }}-win-x64-portable.zip

  installer:
    # 手动触发专属：产出 NSIS 安装包（asar: true 那条通路），只上传 workflow artifact，不建也不改 Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # extraResources 引用 bin/cloudflared.exe（electron-builder.yml），文件必须先就位
      - name: 下载 cloudflared（捆绑到安装包 resources/bin）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile bin/cloudflared.exe
          if ((Get-Item bin/cloudflared.exe).Length -lt 5MB) { Write-Error "cloudflared.exe 下载不完整"; exit 1 }

      # dist = npm run build && electron-builder --win（build 里含 typecheck，所以不用再单跑一遍 build）
      # --publish never 是必需的：electron-builder 一认出 CI 就自己去发 GitHub Release
      #   （实测日志第二行就是 "artifacts will be published if draft release exists reason=CI detected"），
      #   而这条 job 的顶层权限是 contents:read、也没有 GH_TOKEN，于是它在**安装包已经建好之后**
      #   报 `GitHub Personal Access Token is not set` 把整条 job 拖红。发布这条路归 portable 那个 job 管。
      - name: 打安装包（electron-builder：NSIS + asar）
        run: npm run dist -- --publish never

      - name: 验安装包与 asar
        shell: pwsh
        run: |
          # 版本取自 package.json（dispatch 时 github.ref_name 是分支名，不能当版本号用）
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem -Path release -Filter "AgentHub-Setup-*.exe" -File | Select-Object -First 1
          if (-not $setup) { Write-Error "electron-builder 没产出 AgentHub-Setup-<version>.exe"; exit 1 }
          if ($setup.Name -ne "AgentHub-Setup-$ver.exe") {
            Write-Error "安装包版本号与 package.json 不符：$($setup.Name) vs $ver"; exit 1
          }
          $mb = [math]::Round($setup.Length / 1MB, 1)
          # NSIS 包体积下限给得很宽松（本机明文便携 zip 是 132MB，安装包正常也就同量级），
          # 目的是抓"生成了个 0 字节的壳"这种假成功，不是拿体积当质量判据
          if ($setup.Length -lt 20MB) { Write-Error "安装包只有 $mb MB，不像真产物"; exit 1 }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $setup.FullName).Hash.ToLower()
          # electron 资源目录：NSIS 之前会先出 win-unpacked，asar 是否真打上就看它里面的 app.asar
          $asar = Join-Path 'release/win-unpacked/resources' 'app.asar'
          if (-not (Test-Path $asar)) {
            Write-Error "没有 release/win-unpacked/resources/app.asar：asar 这条通路根本没被构建"
            exit 1
          }
          if (Test-Path (Join-Path 'release/win-unpacked/resources' 'app')) {
            Write-Error "app.asar 旁边还留着明文 app 目录：asar 配置没生效"
            exit 1
          }
          # listPackage 返回的路径用的是**本机分隔符**：Windows 上实测是 `\out\main\index.js` 这种
          # 反斜杠带前导斜杠的形状（Linux/macOS 上才是 / 开头），所以判据先归一化再比，
          # 别把分隔符写死——否则这条检查在别的 runner 镜像上会假红。
          # 这三条少一条就说明"打进包的文件"和便携版跑的不是同一份东西。
          node -e "
            const asar = require('@electron/asar');
            const norm = (p) => p.replace(/\\/g, '/').replace(/^\/+/, '');
            const have = new Set(asar.listPackage(process.argv[1]).map(norm));
            const need = ['package.json', 'out/main/index.js', 'dist/renderer/bundle.js'];
            const missing = need.filter((n) => !have.has(n));
            if (missing.length) { console.error('asar 里缺：' + missing.join(', ')); process.exit(1); }
            console.log('asar 条目 ' + have.size + ' 个，关键三条都在');
            require('fs').writeFileSync('asar-list.txt', [...have].sort().join('\n'));
          " $asar
          if ($LASTEXITCODE -ne 0) { Write-Error "asar 内容校验失败"; exit 1 }
          Write-Host "安装包：$($setup.Name)｜$mb MB｜sha256 $hash"
          "## 安装包自检`n`n- 文件：``$($setup.Name)``（$mb MB）`n- sha256：``$hash```n- asar：已生效，`release/win-unpacked/resources/app.asar` 里没有明文 app 目录" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传安装包与 asar 清单
        uses: actions/upload-artifact@v4
        with:
          name: AgentHub-win-installer
          path: |
            release/AgentHub-Setup-*.exe
            asar-list.txt
          if-no-files-found: error
          retention-days: 30
