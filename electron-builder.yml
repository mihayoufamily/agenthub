appId: com.agenthub.app
productName: AgentHub
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - dist/**/*
  - build/icon.ico
  - "!node_modules/**/*"
  - package.json
asar: true
win:
  target:
    - nsis
  icon: build/icon.ico
  # 未配置签名证书：构建为未签名安装包，安装时系统可能提示"未知发布者"，属预期行为
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: AgentHub-Setup-${version}.${ext}
  # NSIS 3.04 的 MUI2 宏在 uninstaller-only 编译路径下会吐 warning 6001（MUI_TEMP1 未引用），
  # 本机 makensis 的 -WX（警告即错误）把它升级成失败 → 安装包打不出来。警告不是缺陷，关掉该升级。
  warningsAsErrors: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
